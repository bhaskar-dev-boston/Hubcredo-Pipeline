kind = "web"
previewPath = "/"
title = "HubCredo"
version = "1.0.0"
id = "artifacts/hubcredo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19953

[services.development]
run = "pnpm --filter @workspace/hubcredo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hubcredo", "run", "build" ]
publicDir = "artifacts/hubcredo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19953"
BASE_PATH = "/"
